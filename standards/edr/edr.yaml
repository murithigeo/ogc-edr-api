components:
  schemas:
    confClasses:
      type: object
      required:
        - conformsTo
      properties:
        conformsTo:
          type: array
          items:
            type: string
    exception:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        description:
          type: string
    landingPage:
      type: object
      required:
        - links
      properties:
        title:
          type: string
          example: Meteorological data server
        description:
          type: string
          example: Access to Meteorological data via a Web API that conforms to the OGC
            API Environmental Data Retrieval specification.
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
          example:
            - href: https://example.org/edr/api
              hreflang: en
              rel: service-desc
              type: application/vnd.oai.openapi+json;version=3.0
              title: ''
            - href: https://example.org/edr/conformance
              hreflang: en
              rel: data
              type: application/json
              title: ''
            - href: https://example.org/edr/collections
              hreflang: en
              rel: data
              type: application/json
              title: ''
        keywords:
          type: array
          items:
            type: string
          example:
            - Temperature
            - Wind
            - Point
            - Trajectory
        provider:
          type: object
          properties:
            name:
              description: Name of organization providing the service
              type: string
            url:
              description: Link to service providers website
              type: string
        contact:
          type: object
          properties:
            email:
              description: Email address of service provider
              type: string
            phone:
              description: Phone number of service provider
              type: string
            fax:
              description: Fax number of service provider
              type: string
            hours:
              type: string
            instructions:
              type: string
            address:
              type: string
            postalCode:
              type: string
            city:
              type: string
            stateorprovince:
              type: string
            country:
              type: string
    link:
      type: object
      required:
        - href
        - rel
      properties:
        href:
          type: string
          example: https://example.com/collections/monitoringsites/locations/1234
        rel:
          type: string
          example: alternate
        type:
          type: string
          example: application/geo+json
        hreflang:
          type: string
          example: en
        title:
          type: string
          example: Monitoring site name
        length:
          type: integer
        templated:
          description: defines if the link href value is a template with values requiring replacement
          type: boolean
    edrFeatureCollectionGeoJSON:
      type: object
      required:
        - type
        - features
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          type: array
          items:
            $ref: '#/components/schemas/featureGeoJSON'
        parameters:
          description: list of the data parameters available in the collection
          type: array
          items:
            $ref: '#/components/schemas/parameter'
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
        timeStamp:
          description: This property indicates the time and date when the response was generated.
          type: string
          format: date-time
          example: '2017-08-17T08:05:32Z'
        numberMatched:
          $ref: '#/components/schemas/numberMatched'
        numberReturned:
          $ref: '#/components/schemas/numberReturned'
    unit:
      type: object
      description: The units of measure
      properties:
        id:
          type: string
        label:
          $ref: '#/components/schemas/i18n'
        symbol:
          oneOf:
            - type: string
            - type: object
              properties:
                type:
                  type: string
                value:
                  type: string
              required:
                - type
                - value
      anyOf:
        - required:
            - label
        - required:
            - symbol
    parameter:
      type: object
      description: Represents metadata about the values of the coverage
      properties:
        id:
          type: string
        type:
          description: Type of the parameter object, shall be "Parameter"
          type: string
          enum:
            - Parameter
        description:
          $ref: '#/components/schemas/i18n'
        observedProperty:
          $ref: '#/components/schemas/observedProperty'
        unit:
          $ref: '#/components/schemas/unit'
        categoryEncoding:
          type: object
          description: Maps IDs of categories in the observedProperty to range values
          additionalProperties:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
      required:
        - type
        - observedProperty
    edrProperties:
      type: object
      title: EDR GeoJSON Properties
      description: Properties to describe existing EDR features -- may be real-world or virtual sampling features.
      example:
        - datetime: 2018-02-12T00:00:00Z/2018-03-18T12:31:12Z
          label: Monitoring site name
          parameter-name:
            - velocity
            - temperature
          edrqueryendpoint: 'https://example.org/api/collections/collection/locations/location_123'
      required:
        - datetime
        - parameter-name
        - label
        - edrqueryendpoint
      properties:
        datetime:
          type: string
          title: Date/time Domain
          description: Either a date-time or a period string that adheres to RFC 3339. Indicates the time instant or period for which data are available from the EDR feature.
          default: ''
          example:
            - 2018-02-12T00:00:00Z/2018-03-18T12:31:12Z
        parameter-name:
          type: array
          title: Available Parameters
          description: Unique IDs of available parameters, this is the value used for querying the data and corresponds to an ID in the parameter metadata of the collection.
          items:
            type: string
            title: Parameter ID list
            description: Each entry should contain one parameter ID that can be used to query against the feature.
            default: ''
            example:
              - velocity
              - temperature
        label:
          type: string
          title: Label
          description: A label such as a site name or other text to use on a link.
          default: ''
          example:
            - Site A
        edrqueryendpoint:
          type: string
          title: EDR Query Endpoint
          description: A URI identifying the query end point. May identify a specific location.
          default: ''
          example:
            - 'https://example.org/api/collections/collection/locations/location_123d}'
    observedProperty:
      type: object
      description: A definition of the quantity being measured.
      properties:
        id:
          type: string
        label:
          $ref: '#/components/schemas/units'
        description:
          $ref: '#/components/schemas/units'
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                $ref: '#/components/schemas/units'
              description:
                $ref: '#/components/schemas/units'
            required:
              - id
              - label
          minItems: 1
      required:
        - label
    units:
      type: object
      description: The units of measure
      properties:
        id:
          type: string
        label:
          $ref: '#/components/schemas/units'
        symbol:
          oneOf:
            - type: string
            - type: object
              properties:
                type:
                  type: string
                value:
                  type: string
              required:
                - type
                - value
      anyOf:
        - required:
            - label
        - required:
            - symbol
    i18n:
      type: object
      description: Object representing an internationalised string.
      additionalProperties:
        type: string
    numberMatched:
      description: |-
        The number of features of the feature type that match the selection
        parameters like `bbox`.
      type: integer
      minimum: 0
      example: 127
    numberReturned:
      type: integer
      description: |-
        The number of features in the feature collection.

        A server may omit this information in a response, if the information
        about the number of features is not known or difficult to compute.

        If the value is provided, the value shall be identical to the number
        of items in the "features" array.
      minimum: 0
      example: 10
    parameterGroup:
      type: object
      description: Represents logical groups of parameters
      properties:
        type:
          description: Type of the parameter group object, shall be "ParameterGroup"
          type: string
          enum:
            - ParameterGroup
        id:
          type: string
        label:
          $ref: '#/components/schemas/i18n'
        description:
          $ref: '#/components/schemas/i18n'
        observedProperty:
          $ref: '#/components/schemas/observedProperty'
        members:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
      required:
        - type
        - members
      anyOf:
        - required:
            - label
        - required:
            - observedProperty
    featureGeoJSON:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          type: string
          enum:
            - Feature
        geometry:
          oneOf:
            - $ref: '#/components/schemas/pointGeoJSON'
            - $ref: '#/components/schemas/multipointGeoJSON'
            - $ref: '#/components/schemas/linestringGeoJSON'
            - $ref: '#/components/schemas/multilinestringGeoJSON'
            - $ref: '#/components/schemas/polygonGeoJSON'
            - $ref: '#/components/schemas/multipolygonGeoJSON'
            - $ref: '#/components/schemas/geometrycollectionGeoJSON'
        properties:
          $ref: '#/components/schemas/edrProperties'
        id:
          oneOf:
            - type: string
            - type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/link'
    geometrycollectionGeoJSON:
      type: object
      required:
        - type
        - geometries
      properties:
        type:
          type: string
          enum:
            - GeometryCollection
        geometries:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/pointGeoJSON'
              - $ref: '#/components/schemas/multipointGeoJSON'
