openapi: 3.0.3
info:
  title: OGC API- EDR
  version: 1.1.0
  description: An example implementation of EDR API in TypeScript
tags:
  - name: Capabilities
    description: Essential characterists of the information available from the API
  - name: Collection metadata
    description: Description of the information available from the collections
  - name: Instance metadata
    description: Description of the information available from the collections
  - name: Collection data queries
    description: Data queries available
  - name: Instance data queries
    description: Data queries available on instances of the collection
paths:
  /:
    get:
      x-exegesis-controller: root_controller
      tags:
        - Capabilities
      summary: landing page of this API
      description: The landing page provides links to the API definition, the Conformance statements and the metadata about the feature data in this dataset.
      operationId: getLandingPage
      parameters:
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          $ref: '#/components/responses/landingpage'
  /conformance:
    x-exegesis-controller: conformance_controller
    get:
      tags:
        - Capabilities
      summary: Information about standards that this API conforms to
      description: List all requirements classes specified in a standard that the server conforms to
      operationId: getConformance
      parameters:
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          $ref: '#/components/responses/conformance'
  /api:
    x-exegesis-controller: service_controller
    get:
      tags:
        - Capabilities
        - Service Metadata
      summary: Get this document
      parameters:
        - $ref: '#/components/parameters/f'
      x-exegesis-operationId: getServiceDesc
      responses:
        '200':
          description: Ok.
          content:
            application/vnd.oai.openapi+json;version=3.0:
              schema:
                type: object
            application/vnd.oai.openapi;version=3.0:
              schema:
                type: string
  /api.html:
    x-exegesis-controller: service_controller
    get:
      tags:
        - Capabilities
        - Service Metadata
      x-exegesis-operationId: getServiceDoc
      responses:
        '200':
          description: Ok.
          content:
            text/html:
              schema:
                type: string
  /collections:
    x-exegesis-controller: collections_controller
    get:
      tags:
        - Capabilities
      summary: List the avialable collections from the service
      operationId: listCollections
      parameters:
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/f'
      responses:
        '200':
          $ref: '#/components/responses/collections'
        default:
          $ref: '#/components/responses/exception'
  /collections/{collectionId}:
    x-exegesis-controller: collections_controller
    get:
      tags:
        - Collection metadata
      summary: List query types supported by the collection
      description: This will provide information about the query types that are supported by the chosen collection Use content negotiation to request HTML or JSON
      operationId: getCollection
      parameters:
